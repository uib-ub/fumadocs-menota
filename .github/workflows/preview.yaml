name: Vercel Preview Deployment
permissions:
  contents: read
  pull-requests: write
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
on:
  push:
    branches-ignore:
      - main
jobs:
  Deploy-Preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CONTENT_SSH_KEY }}
      - name: Add repo to known hosts
        run: ssh-keyscan git.app.uib.no >> ~/.ssh/known_hosts
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Pull submodules
        run: git submodule update --init --recursive
      - name: Create symlinks
        run: mkdir -p public/legacy/handbook && cp -r legacy/content-menota/handbok/handbok_1 public/legacy/handbook/v1
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}
